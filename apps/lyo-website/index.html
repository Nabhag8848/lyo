<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYO</title>
    <base href="/" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="LYO" />
    <meta name="description" content="Virtual Fitting Room" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lyo.fashion/" />
    <meta property="og:title" content="LYO" />
    <meta property="og:description" content="Virtual Fitting Room" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:site_name" content="LYO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.lyo.fashion/" />
    <meta name="twitter:title" content="LYO" />
    <meta name="twitter:description" content="Virtual Fitting Room" />

      name="twitter:image"
      content="https://www.lyo.fashion/opengraph.png"
    />

    <meta name="twitter:site" content="@lyofashion" />

    />

    <link rel="stylesheet" href="/src/styles.css" />
